name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Typecheck, Lint, Test, Build, Licenses, Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check dependency licenses
        run: npm run check:licenses

      - name: Audit production dependencies (reporting known upstream Excalidraw transitive alerts)
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint and Prettier check
        run: npm run lint

      - name: Run unit and runtime integration tests (Vitest + Miniflare)
        env:
          REQUIRE_RUNTIME: "1"
        run: npm run test

      - name: Build web and worker
        run: npm run build
